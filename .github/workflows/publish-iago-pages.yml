name: Publicar IAGO MODAS estática



on:

  push:
  
    branches: [gh-pages]
    
  workflow_dispatch:
  


permissions:

  contents: read
  
  pages: write
  
  id-token: write
  


concurrency:

  group: pages
  
  cancel-in-progress: false
  


jobs:

  deploy:
  
    environment:
    
      name: github-pages
      
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Baixar versão publicada
      
        uses: actions/checkout@v4
        
      - name: Enviar storefront estático
      
        uses: actions/upload-pages-artifact@v3
        
        with:
        
          path: index.html
          
      - name: Publicar GitHub Pages
      
        id: deployment
        
        uses: actions/deploy-pages@v4
        























