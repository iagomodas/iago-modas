name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verificar código e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Instalar pnpm fixo para o runner
        run: |
          npm install --global pnpm@11.24.0 --ignore-scripts
          pnpm --version
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Checar tipos
        run: pnpm run check
      - name: Executar testes
        run: pnpm test
      - name: Auditar dependências de produção
        run: pnpm audit --prod --audit-level high
      - name: Validar build estático
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build:static
